name: Build macOS Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - feat/tools-status-probe
    paths:
      - .github/workflows/build-macos-desktop.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS universal package
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/workspace-desktop/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Install desktop dependencies
        run: npm ci --prefix apps/workspace-desktop

      - name: Build bundled web application
        run: npm run build:web --prefix apps/workspace-desktop

      - name: Build unsigned macOS packages
        working-directory: apps/workspace-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >
          npx electron-builder --mac dmg zip --universal --publish never
          --config.directories.output=release-macos

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: TUODIAO-macos-universal
          path: |
            apps/workspace-desktop/release-macos/*.dmg
            apps/workspace-desktop/release-macos/*.zip
          if-no-files-found: error
          retention-days: 14
