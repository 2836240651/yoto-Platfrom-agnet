name: Build macOS Desktop Release

on:
  push:
    branches: ["feat/douyin-query-lineage"]
    paths:
      - ".github/workflows/desktop-macos-release.yml"
      - "apps/web/**"
      - "apps/workspace-desktop/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/workspace-desktop/package-lock.json
      - name: Build web bundle
        run: |
          npm ci --prefix apps/web
          npm run build --prefix apps/web
      - name: Build desktop package
        working-directory: apps/workspace-desktop
        run: |
          npm ci
          node scripts/copy-web-dist.cjs
          npx electron-builder --mac --${{ matrix.arch }}
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/workspace-desktop/dist-electron/*.dmg
            apps/workspace-desktop/dist-electron/*.zip

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-${GITHUB_SHA}"
          title="TUODIAO Desktop ${GITHUB_SHA::7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* --title "$title" --notes "macOS x64 and arm64 desktop packages built from commit ${GITHUB_SHA}. Unsigned packages may require a macOS security confirmation on first launch."
          fi
