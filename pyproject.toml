[project]
name = "agent-platform"
version = "0.1.0"
description = "Internal vertical agent platform: LangGraph runtime + Skills + MCP + Memory"
authors = [{ name = "Agent Platform Team" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-community>=0.3.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40.0"]
memory = ["chromadb>=0.5.0"]
dev = ["mypy>=1.11.1", "ruff>=0.6.1", "pytest>=9.0.0"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "langgraph.templates.agent",
    "agent",
    "agent.nodes",
    "agent.memory",
    "agent.config",
    "agent.tools",
]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"
"agent.nodes" = "src/agent/nodes"
"agent.memory" = "src/agent/memory"
"agent.config" = "src/agent/config"
"agent.tools" = "src/agent/tools"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = ["E", "F", "I", "D", "UP"]
lint.ignore = ["UP006", "UP007", "UP035", "D417", "E501"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]
